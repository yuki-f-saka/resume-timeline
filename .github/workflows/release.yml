name: release

# Pushing a tag is the whole release procedure: GoReleaser builds every
# target, packs the archives and publishes them as GitHub Release assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the release and upload its assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is built from the full history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
